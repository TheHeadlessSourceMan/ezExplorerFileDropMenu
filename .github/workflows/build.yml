name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build DLL and installer
        shell: cmd
        run: build.bat 1.0.${{ github.run_number }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ezExplorerFileDropMenu-setup
          path: artifacts/installer/*.exe
          if-no-files-found: error

      - name: Upload raw release files
        uses: actions/upload-artifact@v4
        with:
          name: ezExplorerFileDropMenu-files
          path: artifacts/release
