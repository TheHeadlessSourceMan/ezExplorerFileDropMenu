name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Check out osTools
        uses: actions/checkout@v4
        with:
          repository: TheHeadlessSourceMan/osTools
          path: osTools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .

      - name: Run unit tests
        shell: pwsh
        env:
          PYTHONPATH: src;${{ github.workspace }}
        run: python -m unittest discover -s tests -v

      - name: Build release artifact
        shell: pwsh
        run: .\build.ps1 -Python python -OsToolsPath "$env:GITHUB_WORKSPACE\osTools"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: symbolic-link-explorer-context-menu
          path: artifacts/release